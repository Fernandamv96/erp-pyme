<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>ERP Pyme · Ingresar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #e8eaf6;
         font-family: "Manrope", system-ui, sans-serif;
         background: radial-gradient(circle at 20% 10%, rgba(91,63,214,.45), transparent 55%),
                     radial-gradient(circle at 85% 85%, rgba(26,166,196,.3), transparent 50%), #08090d; }
  form { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 18px; padding: 32px; border-radius: 22px;
         background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12);
         backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
  h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -.02em; }
  p { margin: 6px 0 0; color: #9aa0bd; font-size: 14px; }
  label { display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 700; color: #c3c7de; }
  input { font: inherit; color: inherit; padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,.16);
          background: rgba(0,0,0,.3); }
  button { font: inherit; font-weight: 700; padding: 12px; border-radius: 12px; border: 0; cursor: pointer; color: #0b0d17;
           background: linear-gradient(135deg, #8b7cf6, #4fd1e8); }
  button:disabled { opacity: .6; cursor: wait; }
  .error { min-height: 20px; margin: 0; color: #ff8fa3; font-size: 14px; }
  :focus-visible { outline: 2px solid #4fd1e8; outline-offset: 3px; }
</style>
</head>
<body>
<form id="formLogin">
  <div>
    <h1>ERP Pyme</h1>
    <p>Ingresa la clave de administrador.</p>
  </div>
  <label>Clave
    <input type="password" id="clave" autocomplete="current-password" required autofocus>
  </label>
  <p class="error" id="error" role="alert"></p>
  <button type="submit" id="btnEntrar">Entrar</button>
</form>
<script src="js/login.js"></script>
</body>
</html>
